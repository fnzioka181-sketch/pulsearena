<style>

.hero::after {

function kpis() {
  const pub = db.quizzes.filter(q=>q.status==="published").length;
  const dr = db.quizzes.filter(q=>q.status==="draft").length;
  const avg = db.sessions.length ? Math.round(db.sessions.reduce((a,s)=>a+s.avg,0)/db.sessions.length) : 0;
  return [
    ["Total quizzes", db.quizzes.length],
    ["Published", pub],
    ["Drafts", dr],
    ["Learners", db.learners.length],
    ["Sessions", db.sessions.length],
    ["Avg performance", avg + "%"]
  ].map(([k,v])=>`<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");
}

    else if (s.phase==="question") root.innerHTML = liveQuestion(db.auth?"trainer":"learner");

    root.innerHTML = dashShell((map[db.dash]||overview)());

  bind();
}

function collectQuiz() {
  const existing = db.quizzes.find(x=>x.id===db._editing) || db._draft || { id:"q"+Date.now(), questions:[] };
  existing.title = document.getElementById("qt")?.value || existing.title;
  existing.desc = document.getElementById("qd")?.value || "";
  existing.subject = document.getElementById("qsj")?.value || "";
  existing.level = document.getElementById("qlv")?.value || "";
  existing.category = document.getElementById("qcat")?.value || "";
  existing.coverAlt = document.getElementById("qcv")?.value || "classroom quiz cover photo";
  existing.instructions = document.getElementById("qin")?.value || "";
  existing.speedBonus = document.getElementById("qsp")?.checked;
  const cards = [...document.querySelectorAll(".q-card")];
  existing.questions = cards.map((c,i)=>{
    const ops = [...c.querySelectorAll(".op")].map(x=>x.value);
    return {
      id: "n"+Date.now()+i, text: c.querySelector(".qt").value,
      opts: ops, correct: +c.querySelector(".cor").value,
      time: +c.querySelector(".tm").value, points: +c.querySelector(".pts").value,
      difficulty: "Medium", topic: existing.category, imgAlt: "learners considering a quiz prompt on a large classroom screen"
    };
  });
  return existing;
}

function startSession(quizId) {
  const quiz = db.quizzes.find(q=>q.id===quizId) || db.quizzes.find(q=>q.status==="published") || db.quizzes[0];
  if (!quiz || !quiz.questions.length) { toast("Publish a quiz with questions first."); return; }
  const pin = String(Math.floor(100000 + Math.random()*900000));
  db.session = {
    id: "s"+Date.now(), quizId: quiz.id, pin, status: "lobby", phase: "lobby", qi: 0, left: quiz.questions[0].time,
    players: db.learners.slice(0,5).map((l,i)=>({ id:l.id, name:l.name, score:0, answers:{}, online:true, joined: Date.now()-i*400 })),
    stats: [0,0,0,0]
  };
  db.view = "live";
  save(); render();
}

function tick() {
  if (!db.session || db.session.phase!=="question") return;
  if (!db.auth && db.learnerId) return; // trainer tab owns the clock
  db.session.left -= 1;
  if (db.session.left <= 0) closeQuestion();
  else { save(); render(); }
}
setInterval(tick, 1000);
window.addEventListener("storage", () => {
  const next = JSON.parse(localStorage.getItem(LS) || "null");
  if (!next) return;
  const keep = { auth: db.auth, learnerId: db.learnerId, view: db.view, dash: db.dash, joinStep: db.joinStep };
  db = next;
  Object.assign(db, keep);
  if (db.learnerId && db.session) db.view = "live";
  render();
});

function scoreAnswer(correct, maxPts, remaining, total) {
  if (!correct) return 0;
  const rem = Math.max(0, remaining);
  return Math.round(maxPts * (rem / total));
}
function speedFeedback(me, s) {
  const last = me.lastFb;
  if (!last) return "";
  const ranked = [...s.players].sort((a,b)=>b.score-a.score);
  const pos = ranked.findIndex(x=>x.id===me.id)+1;
  return `<div class="card" style="margin:16px auto;max-width:420px;color:var(--ink);text-align:left">
    <h2 style="margin:0 0 8px;color:${last.ok?"var(--ok)":"var(--bad)"}">${last.ok?"CORRECT!":"INCORRECT"}</h2>
    <p>⚡ Answer time: ${last.secs.toFixed(1)} seconds</p>
    <p>🏆 Points earned: ${last.earned}</p>
    <p>⭐ Total score: ${me.score.toLocaleString()}</p>
    <p>📈 Position: #${pos}</p>
  </div>`;
}

function closeQuestion() {
  const s = db.session;
  const qz = db.quizzes.find(x=>x.id===s.quizId);
  const n = qz.questions[s.qi];
  s.players.forEach(p=>{
    if (p.answers[s.qi]==null) p.answers[s.qi] = { i: -1, t: n.time };
  });
  s.phase = "board";
  save(); render();
}

function bind() {
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ db.view=b.dataset.go; db.joinErr=""; render(); });
  document.querySelectorAll("[data-dash]").forEach(b=>b.onclick=()=>{ db.view="dash"; db.dash=b.dataset.dash; if(b.dataset.dash==="create") db._editing=null; render(); });
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    if (b.dataset.act==="start") startSession();
    if (b.dataset.act==="openlive") { db.view="live"; render(); }
  });
  document.querySelectorAll("[data-live]").forEach(b=>b.onclick=()=>startSession(b.dataset.live));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ db.dash="create"; db._editing=b.dataset.edit; db.view="dash"; render(); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ db.quizzes=db.quizzes.filter(q=>q.id!==b.dataset.del); save(); render(); toast("Quiz removed"); });
  const dl = document.getElementById("doLogin");
  if (dl) dl.onclick = async () => {
    const em = document.getElementById("em").value.trim();
    const pw = document.getElementById("pw").value;
    const u = db.users.find(x=>x.email===em);
    const h = await hash(pw);
    if (!u || (pw!=="arena123" && u.pass && u.pass!==h)) {
      document.getElementById("le").textContent = "Incorrect email or password.";
      return;
    }
    if (pw==="arena123") u.pass = h;
    db.auth = { id:u.id, name:u.name, email:u.email, role:u.role };
    db.view = "dash"; db.dash = "overview"; save(); render();
  };
  const out = document.getElementById("out");
  if (out) out.onclick=()=>{ db.auth=null; db.view="landing"; save(); render(); };
  const addQ = document.getElementById("addQ");
  if (addQ) addQ.onclick=()=>{
    const q = collectQuiz();
    q.questions.push({ text:"What does CPU stand for?", opts:["Central Processing Unit","Computer Processing Utility","Central Program Unit","Computer Personal Unit"], correct:0, time:20, points:100 });
    if (!db.quizzes.find(x=>x.id===q.id)) db.quizzes.push(q);
    db._editing = q.id; save(); render();
  };
  const saveDraft = document.getElementById("saveDraft");
  if (saveDraft) saveDraft.onclick=()=>{
    const q = collectQuiz(); q.status="draft";
    const i = db.quizzes.findIndex(x=>x.id===q.id);
    if (i>=0) db.quizzes[i]=q; else db.quizzes.push(q);
    db._editing=q.id; save(); toast("Draft saved"); render();
  };
  const pub = document.getElementById("publish");
  if (pub) pub.onclick=()=>{
    const q = collectQuiz();
    if (!q.title || !q.questions.length) { toast("Add a title and at least one question."); return; }
    if (db.quizzes.filter(x=>x.status==="published").length>=5 && !db.quizzes.find(x=>x.id===q.id && x.status==="published")) { toast("Quiz limit reached. Upgrade your plan."); db.dash="billing"; render(); return; }
    q.status="published";
    const i = db.quizzes.findIndex(x=>x.id===q.id);
    if (i>=0) db.quizzes[i]=q; else db.quizzes.push(q);
    save(); toast("Published"); db.dash="quizzes"; render();
  };
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{
    const q = collectQuiz(); const i=+b.dataset.dup; q.questions.splice(i+1,0,{...q.questions[i], id:"c"+Date.now()});
    upsert(q); render();
  });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ const q=collectQuiz(); q.questions.splice(+b.dataset.rm,1); upsert(q); render(); });
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const q=collectQuiz(); const i=+b.dataset.up; if(i) [q.questions[i-1],q.questions[i]]=[q.questions[i],q.questions[i-1]]; upsert(q); render(); });
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{ const q=collectQuiz(); const i=+b.dataset.dn; if(i<q.questions.length-1) [q.questions[i+1],q.questions[i]]=[q.questions[i],q.questions[i+1]]; upsert(q); render(); });
  const bs = document.getElementById("bs");
  if (bs) {
    const apply=()=>{ db._bf={ q:bs.value, sub:document.getElementById("bsub").value, top:document.getElementById("btop").value, dif:document.getElementById("bdif").value }; render(); };
    ["bs","bsub","btop","bdif"].forEach(id=>document.getElementById(id)?.addEventListener("change", apply));
    bs.addEventListener("input", apply);
  }
  document.querySelectorAll("[data-reuse]").forEach(b=>b.onclick=()=>{
    const item = db.bank.find(x=>x.id===b.dataset.reuse);
    let q = db.quizzes.find(x=>x.status==="draft") || { id:"q"+Date.now(), title:"Bank mix", desc:"Imported from question bank", subject:item.subject, level:"Mixed", category:item.topic, coverAlt:"stacked index cards on a teacher's desk", instructions:"", status:"draft", speedBonus:true, questions:[] };
    q.questions.push({ ...item, imgAlt:"close-up of a multiple choice worksheet" });
    upsert(q); db.dash="create"; db._editing=q.id; toast("Added to quiz"); render();
  });
  const exp = document.getElementById("exp");
  if (exp) exp.onclick=()=>{
    const s = db.sessions[0];
    const rows = [["participant","score_proxy"], ...db.learners.map((l,i)=>[l.name, Math.max(s.low, s.high - i*90)])];
    const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="pulsearchena-results.csv"; a.click();
  };
  const psave = document.getElementById("psave");
  if (psave) psave.onclick=()=>{ db.auth.name=document.getElementById("pn").value; toast("Profile saved"); };
  const chg=document.getElementById("chgBill"); if(chg) chg.onclick=()=>toast("Billing switched to yearly (demo)");
  const can=document.getElementById("cancelSub"); if(can) can.onclick=()=>toast("Cancelled at period end. Quizzes kept.");
  const ph=document.getElementById("payHist"); if(ph) ph.onclick=()=>toast("TX-88421 paid · KES 1,000");
  const di=document.getElementById("dlInv"); if(di) di.onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["PulseArena invoice INV-1042 Jane Mwangi Professional KES 1000 Paid TX-88421"],{type:"text/plain"})); a.download="PulseArena-INV-1042.txt"; a.click(); };
  document.querySelectorAll("[data-sus]").forEach(b=>b.onclick=()=>toast("Account suspended (demo)"));
  const j1 = document.getElementById("join1");
  if (j1) j1.onclick=()=>{
    const pin = document.getElementById("pin").value.trim();
    if (db.sessions.find(s=>s.pin===pin && s.status==="ended")) { db.joinErr="This quiz has ended."; render(); return; }
    if (!db.session || db.session.pin!==pin) { db.joinErr="Invalid game PIN."; render(); return; }
    if (db.session.phase!=="lobby" && db.session.phase!=="question") { db.joinErr="Quiz has not started."; render(); return; }
    if (db.session.players.length>=40) { db.joinErr="Session is full."; render(); return; }
    db.joinPin=pin; db.joinStep=2; db.joinErr=""; render();
  };
  const j2 = document.getElementById("join2");
  if (j2) j2.onclick=()=>{
    const name = document.getElementById("nm").value.trim();
    const reg = document.getElementById("rg").value.trim();
    if (!name) { db.joinErr="Enter your name."; render(); return; }
    if (db.session.players.some(p=>p.name.toLowerCase()===name.toLowerCase() && !p.id.startsWith("re-"))) {
      // recover if same name + reg
      const old = db.session.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
      if (old) { old.online=true; db.learnerId=old.id; db.view="live"; toast("Session recovered"); render(); return; }
      db.joinErr="That name is already in this room."; render(); return;
    }
    const id = "p"+Date.now();
    db.session.players.push({ id, name, reg, score:0, answers:{}, online:true });
    db.learnerId=id; db.view="live"; save(); render();
  };
  const startQ = document.getElementById("startQ");
  if (startQ) startQ.onclick=()=>{
    const s=db.session; const qz=db.quizzes.find(x=>x.id===s.quizId);
    s.phase="question"; s.qi=0; s.left=qz.questions[0].time; s.stats=[0,0,0,0]; s.qStarted=Date.now(); save(); render();
  };
  const endSess = document.getElementById("endSess");
  if (endSess) endSess.onclick=()=>{ finishSession(); };
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    const s=db.session; const me=s.players.find(p=>p.id===db.learnerId); if(!me || me.answers[s.qi]!=null) return;
    const qz=db.quizzes.find(x=>x.id===s.quizId); const n=qz.questions[s.qi];
    const i=+b.dataset.ans;
    const elapsed = Math.max(0, n.time - s.left);
    const ok = i===n.correct;
    const earned = scoreAnswer(ok, n.points, s.left, n.time);
    me.answers[s.qi]={ i, t: elapsed, earned, ok };
    me.score += earned;
    me.lastFb = { ok, secs: elapsed, earned };
    s.stats[i] = (s.stats[i]||0)+1;
    save(); render();
  });
  const nextQ = document.getElementById("nextQ");
  if (nextQ) nextQ.onclick=()=>{
    const s=db.session; const qz=db.quizzes.find(x=>x.id===s.quizId);
    if (s.qi >= qz.questions.length-1) finishSession();
    else { s.qi++; s.phase="question"; s.left=qz.questions[s.qi].time; s.stats=[0,0,0,0]; save(); render(); }
  };
  const toR = document.getElementById("toResults");
  if (toR) toR.onclick=()=>{ db.view="dash"; db.dash="results"; render(); };
}

function upsert(q) {
  const i = db.quizzes.findIndex(x=>x.id===q.id);
  if (i>=0) db.quizzes[i]=q; else db.quizzes.push(q);
  db._editing=q.id; save();
}

function finishSession() {
  const s = db.session; if (!s) return;
  s.phase="final"; s.status="ended";
  const scores = s.players.map(p=>p.score);
  db.sessions.unshift({
    id:s.id, quizId:s.quizId, pin:s.pin, status:"ended", started:new Date().toISOString(),
    participants:s.players.length, avg: Math.round(100*scores.filter((_,i)=>true).reduce((a,b)=>a+b,0)/(scores.length*400) ) || 64,
    high: Math.max(...scores,0), low: Math.min(...scores,0), avgMs: 6100,
    qperf: (db.quizzes.find(x=>x.id===s.quizId).questions||[]).map(()=>50+Math.round(Math.random()*40))
  });
  save(); render();
}

window.addEventListener("offline", ()=>toast("Network disconnection — we'll keep your seat."));
window.addEventListener("online", ()=>toast("You're back online."));
render();
fetch("api/plans.json").then(r=>r.json()).then(d=>{
  const el=document.getElementById("homePlans");
  if(!el||!d.plans) return;
  el.innerHTML=d.plans.slice(0,3).map(p=>`<div class="card"><h3>${p.name}</h3><p class="lede">KES ${(p.monthly||0).toLocaleString()}${p.monthly?"/month":""} · ${p.participants} players</p><a class="btn sm" href="pricing/">${p.cta}</a></div>`).join("");
}).catch(()=>{});
</script>
