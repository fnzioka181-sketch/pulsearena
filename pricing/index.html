<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — PulseArena</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Source Sans 3",system-ui;background:#f6f3ee;color:#12202b}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
h1{font-family:Fraunces,Georgia,serif;font-size:42px}
.toggle{display:inline-flex;border:1px solid #dce4ea;border-radius:999px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:10px 18px;font-weight:700;cursor:pointer}
.toggle button.on{background:#e35d2a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.card{background:#fff;border:1px solid #dce4ea;border-radius:18px;padding:20px;box-shadow:0 16px 40px rgba(18,32,43,.08)}
.price{font-size:28px;font-family:Fraunces,serif}
.btn{display:inline-block;background:#e35d2a;color:#fff;text-decoration:none;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:12px}
.save{color:#1b7a4a;font-size:13px}
nav a{margin-right:14px;color:#12202b}
</style>
</head>
<body>
<div class="wrap">
<nav><a href="../">Home</a><a href="../join/">Join Quiz</a><a href="../admin/">Owner admin</a></nav>
<h1>Plans for every classroom</h1>
<p>Prices in Kenyan Shillings. Annual billing saves two months on Starter and Professional.</p>
<div class="toggle"><button id="m" class="on">MONTHLY</button><button id="y">YEARLY</button></div>
<div class="grid" id="cards"></div>
<div class="card" style="margin-top:20px" id="event"></div>
<p id="pay" class="card" style="display:none;margin-top:16px"></p>
</div>
<script src="../biz.js"></script>
<script>
let yearly=false;
function kes(n){return "KES "+n.toLocaleString();}
function draw(){
  const b=PulseBiz.load();
  const cards=document.getElementById("cards");
  cards.innerHTML=b.plans.map(p=>{
    const price=p.id==="institution"?kes(p.yearly)+"/year": yearly?(p.yearly?kes(p.yearly)+"/year":kes(0)):kes(p.monthly)+(p.monthly?"/month":"");
    const save=yearly && p.monthly && p.yearly ? `<div class="save">Save ${kes(p.monthly*12-p.yearly)} vs monthly</div>`:"";
    const cta=p.id==="free"?"Start Free":p.id==="starter"?"Choose Starter":p.id==="professional"?"Choose Professional":"Contact Sales";
    return `<div class="card"><h2>${p.name}</h2><div class="price">${price}</div>${save}
      <p>Participants: ${p.participants}</p><p>Quizzes: ${p.quizzes>=9999?"Unlimited":p.quizzes}</p>
      <p>Analytics: ${p.analytics}</p><p>Reports: ${p.reports}</p><p>Question bank: ${p.bank}</p><p>Branding: ${p.branding}</p>
      <p>${p.features}</p>
      <button class="btn" data-plan="${p.id}">${cta}</button></div>`;
  }).join("");
  document.getElementById("event").innerHTML=`<h2>One-Time Event</h2><p class="price">${kes(b.eventPrice)}</p>
    <p>1 live quiz session · up to 100 participants · unlimited questions · speed scoring · leaderboard · download results. Expires when the event ends.</p>
    <button class="btn" id="buyev">Buy One-Time Event</button>`;
  document.querySelectorAll("[data-plan]").forEach(btn=>btn.onclick=()=>choose(btn.dataset.plan));
  document.getElementById("buyev").onclick=()=>choose("event");
}
function choose(id){
  if(id==="institution"){ document.getElementById("pay").style.display="block"; document.getElementById("pay").textContent="Sales notified. Custom institution pricing available."; return; }
  if(id==="free"){ location.href="../"; return; }
  location.href="../checkout/?plan="+encodeURIComponent(id)+"&yearly="+(yearly?"1":"0");
}
document.getElementById("m").onclick=()=>{yearly=false;document.getElementById("m").classList.add("on");document.getElementById("y").classList.remove("on");draw();};
document.getElementById("y").onclick=()=>{yearly=true;document.getElementById("y").classList.add("on");document.getElementById("m").classList.remove("on");draw();};
draw();
</script>
</body>
</html>
